<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>yt2radarr</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Icons -->

    <style>
        body {
            background-color: #121212;
            color: #eaeaea;
        }
        .card {
            background-color: #1f1f1f;
            border: 1px solid #333;
        }
        .progress {
            height: 12px;
        }
        .footer {
            margin-top: 40px;
            text-align: center;
            opacity: 0.6;
        }
    </style>
</head>

<body>
<div class="container py-5">

    <div class="row justify-content-center">
        <div class="col-lg-6">

                <h2 class="text-center mb-4">
                    <i class="bi bi-youtube"></i> yt2radarr
                </h2>

                <form id="downloadForm">
                    <label class="form-label">YouTube URL</label>
                    <input type="text" id="url" class="form-control mb-3" placeholder="Paste YouTube link here">

                    <button class="btn btn-danger w-100">
                        <i class="bi bi-cloud-download"></i> Download & Send
                    </button>
                </form>

                <div id="statusBox" class="alert alert-secondary mt-4 d-none"></div>

                <div id="progressContainer" class="mt-3 d-none">
                    <label class="form-label">Progress</label>
                    <div class="progress">
                        <div id="progressFill" class="progress-bar bg-success" style="width: 0%"></div>
                    </div>
                </div>

                <div id="history" class="mt-4 d-none">
                    <h5>Recent Downloads</h5>
                    <ul id="historyList" class="list-group"></ul>
                </div>

            </div>

            <div class="footer">
                yt2radarr • Flask • yt-dlp • Radarr Integration
            </div>

        </div>
    </div>
</div>

    const progressFill = document.getElementById("progressFill");
